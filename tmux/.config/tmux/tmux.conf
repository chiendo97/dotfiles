# tmux configuration (stow-managed, migrated from home-manager programs.tmux)
#
# Reload: prefix + r
# Plugins: managed by TPM (bootstrapped at the bottom of this file)

# ============================================= #
# Defaults from the sensible plugin             #
# (loaded first, like home-manager sensibleOnTop, so user
#  settings below can override it)
# --------------------------------------------- #
if-shell 'test -f "$HOME/.config/tmux/plugins/tmux-sensible/sensible.tmux"' \
    'run-shell "$HOME/.config/tmux/plugins/tmux-sensible/sensible.tmux"'

# ============================================= #
# === General ===
# --------------------------------------------- #
set  -g default-terminal "tmux-256color"
set  -g base-index      1
setw -g pane-base-index 1

set -g status-keys vi
set -g mode-keys   vi

# rebind main key: C-Space
unbind C-b
set -g prefix C-Space
bind -N "Send the prefix key through to the application" \
  C-Space send-prefix

set  -g mouse             on
set  -g focus-events      on
setw -g aggressive-resize off
setw -g clock-mode-style  12
set  -s escape-time       0
set  -g history-limit     50000

set -g allow-rename off
set -g detach-on-destroy off
# baseIndex only sets base-index, not pane-base-index
set -g pane-base-index 1
set -as terminal-features ',tmux-256color:RGB:clipboard'
set -g extended-keys on
set -g extended-keys-format csi-u
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#{session_name}"
set-option -s set-clipboard on
set -g allow-passthrough on
set -g display-panes-time 2000

# ============================================= #
# === Key Bindings ===
# --------------------------------------------- #
unbind Space

# Reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Configuration Reloaded!"

# Vim-tmux navigator integration
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Zoom with Ctrl-z
bind-key -n 'C-z' resize-pane -Z

# Switch to last session
unbind BSpace
bind-key BSpace switch-client -l

# Split panes
unbind =
unbind -
bind = split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# Resize panes
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Synchronize panes
bind-key C-a setw synchronize-panes

# Copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind v copy-mode

# Window navigation
bind-key -n M-h previous-window
bind-key -n M-l next-window

# Session switcher with fzf
unbind -n C-s
bind -n C-s run-shell -b "tmux list-sessions -F \"##S\" | fzf-tmux -h --layout=reverse | xargs tmux switch -t"

# Window picker with fzf
bind w run-shell -b "tmux list-windows -F '##I: ##W' | fzf-tmux -h --layout=reverse | cut -d: -f1 | xargs tmux select-window -t"

# New window keeps current path
bind c new-window -c '#{pane_current_path}'

# Quick kill pane without confirmation
bind X kill-pane

# Popup scratch terminal
bind t display-popup -E -w 90% -h 90% -d '#{pane_current_path}'

# Swap windows
bind-key -n C-S-Left swap-window -d -t -1
bind-key -n C-S-Right swap-window -d -t +1

# ============================================= #
# === Theme: Gruvbox Herdr Light (medium) ===
# --------------------------------------------- #
set-option -g status "on"
set-option -g status-style 'bg=#f2e5bc,fg=#3c3836'
set-window-option -g window-status-style 'bg=#f2e5bc,fg=#504945'
set-window-option -g window-status-activity-style 'fg=#9d0006,bold'
set-window-option -g window-status-current-style 'bg=#af3a03,fg=#fbf1c7,bold'
set-option -g pane-border-lines heavy
set-option -g pane-border-indicators both
set-option -g pane-border-status bottom
set-option -g pane-border-format "#[bold] #{pane_index}: #{pane_current_command} #[nobold]#{?pane_active,, │ #{pane_current_path}}"
set-option -g pane-active-border-style 'fg=#3c3836,bold'
set-option -g pane-border-style 'fg=#7c6f64'

# Active shells use the theme's background; inactive shells use its canvas.
# Neovim paints its own medium-light background (#fbf1c7).
set-option -g window-style 'fg=#3c3836,bg=#f2e5bc'
set-option -g window-active-style 'fg=#3c3836,bg=#fbf1c7'
set-option -g message-style 'bg=#f2e5bc,fg=#3c3836'
set-option -g message-command-style 'bg=#f2e5bc,fg=#3c3836'
set-option -g mode-style 'bg=#d5c4a1,fg=#3c3836'
set-option -g display-panes-active-colour '#076678'
set-option -g display-panes-colour '#504945'
set-window-option -g clock-mode-colour '#076678'
set-window-option -g window-status-bell-style 'bg=#9d0006,fg=#fbf1c7'

# Status bar
set-option -g status-position "top"
set-option -g status-justify "left"
set-option -g status-left-style none
set-option -g status-left-length "80"
set-option -g status-right-style none
set-option -g status-right-length "80"
set-window-option -g window-status-separator ""

set-option -g status-left "#[fg=#3c3836,bold] #S #[default] │ "
set-option -g status-right "#{prefix_highlight} %Y-%m-%d · %H:%M │ #h "
set-option -g @prefix_highlight_fg '#fbf1c7'
set-option -g @prefix_highlight_bg '#af3a03'

set-window-option -g window-status-current-format " #I: #W#{?window_zoomed_flag,*Z,} "
set-window-option -g window-status-format " #I: #W "

# ============================================= #
# === Plugins (TPM) ===
# --------------------------------------------- #
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'chiendo97/tmux-buffer'

# Bootstrap TPM on first run (plugins live in ~/.config/tmux/plugins/)
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.config/tmux/plugins/tpm/tpm'