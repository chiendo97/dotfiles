# Gruvbox Herdr Light (medium), shared with Neovim and tmux
# https://github.com/Codesmith28/gruvbox-herdr-app
foreground #3c3836
background #fbf1c7
selection_foreground #3c3836
selection_background #d5c4a1

# Cursor
cursor #3c3836
cursor_text_color #fbf1c7
cursor_shape block
cursor_blink_interval 0
# Cursor Settings
cursor_trail 1
cursor_trail_start_threshold 1
cursor_shape_unfocused hollow
shell_integration no-cursor

# Normal colors
color0 #3c3836
color1 #cc241d
color2 #98971a
color3 #d79921
color4 #458588
color5 #b16286
color6 #689d6a
color7 #7c6f64

# Bright colors
color8  #928374
color9  #9d0006
color10 #79740e
color11 #b57614
color12 #076678
color13 #8f3f71
color14 #427b58
color15 #fbf1c7

# Font
# font_family Liga SFMono Nerd Font
font_size 11.5
map cmd+equal change_font_size all +0.5
map cmd+minus change_font_size all -0.5
map cmd+enter send_text all \x0d

# Shell
shell /bin/zsh

# Window
hide_window_decorations titlebar-only
macos_option_as_alt yes
macos_hide_from_tasks no
macos_quit_when_last_window_closed yes

# Terminal
term xterm-kitty
clipboard_control write-clipboard read-clipboard

# Window size (columns x lines)
initial_window_width 250c
initial_window_height 70c

# Behavior
confirm_os_window_close 0


# BEGIN_KITTY_FONTS
font_family      family="RecMonoCasual Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
